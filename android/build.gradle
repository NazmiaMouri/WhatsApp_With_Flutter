allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// country_codes 3.3.0 hard-codes compileSdkVersion 31. Override it here so
// the plugin can use AndroidX dependencies that require API 34 or newer.
subprojects { project ->
    if (project.name == 'country_codes') {
        afterEvaluate {
            if (project.extensions.findByName('android') != null) {
                project.android.compileSdkVersion 36
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
